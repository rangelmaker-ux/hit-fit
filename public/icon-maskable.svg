<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="maskBgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#181D26" />
      <stop offset="60%" stop-color="#0B0D12" />
      <stop offset="100%" stop-color="#050709" />
    </radialGradient>
    <linearGradient id="maskLimeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4FF38" />
      <stop offset="50%" stop-color="#C3F75A" />
      <stop offset="100%" stop-color="#72B814" />
    </linearGradient>
    <linearGradient id="maskMagentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF52A8" />
      <stop offset="50%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#B30F5B" />
    </linearGradient>
    <linearGradient id="maskBridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C3F75A" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FF2E93" />
    </linearGradient>
  </defs>

  <!-- Fundo Total para preenchimento de borda a borda do Maskable Icon -->
  <rect x="0" y="0" width="512" height="512" fill="url(#maskBgGlow)" />

  <!-- Monograma HF escalado para respeitar a safe area circular de 80% (escala 0.78) -->
  <g transform="translate(256, 256) scale(0.78)">
    <circle cx="0" cy="0" r="190" fill="none" stroke="url(#maskBridgeGrad)" stroke-width="2" stroke-dasharray="10 14" opacity="0.25" />

    <!-- Coluna Esquerda do 'H' -->
    <path d="M -104 -115 L -62 -115 L -62 115 L -104 115 Z" fill="url(#maskLimeGrad)" />

    <!-- Coluna Direita do 'H' e Corpo do 'F' -->
    <path d="M 6 -115 L 48 -115 L 48 115 L 6 115 Z" fill="url(#maskMagentaGrad)" />

    <!-- Braço Superior do 'F' -->
    <path d="M 48 -115 L 118 -115 L 100 -75 L 48 -75 Z" fill="url(#maskMagentaGrad)" />

    <!-- Braço Médio do 'F' -->
    <path d="M 48 -20 L 94 -20 L 80 18 L 48 18 Z" fill="url(#maskMagentaGrad)" />

    <!-- Barra Conectora / Pulso Cardíaco HF -->
    <path d="M -62 -18 L -20 -18 L -6 -48 L 6 12 L 18 -18 L 48 -18 L 48 18 L 26 18 L 6 42 L -6 -18 L -20 18 L -62 18 Z" fill="url(#maskBridgeGrad)" />

    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6" />
  </g>
</svg>
